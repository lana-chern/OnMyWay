name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: migration_test
          POSTGRES_USER: migration_test
          POSTGRES_PASSWORD: migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U migration_test -d migration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build, test, and verify PostgreSQL migrations
        run: ./mvnw --batch-mode --no-transfer-progress verify
        env:
          MIGRATION_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/migration_test
          MIGRATION_TEST_DB_USERNAME: migration_test
          MIGRATION_TEST_DB_PASSWORD: migration_test
