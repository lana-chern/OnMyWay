spring.datasource.url=${OMW_DB_URL}
spring.datasource.username=${OMW_DB_USERNAME}
spring.datasource.password=${OMW_DB_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver

omw.jwt.secret=${OMW_JWT_SECRET:}
omw.jwt.expiration-ms=${OMW_JWT_EXPIRATION_MS:900000}

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Comma-separated exact IP addresses of trusted reverse proxies. Do not trust forwarded headers otherwise.
omw.auth.trusted-proxy-addresses=${OMW_AUTH_TRUSTED_PROXY_ADDRESSES:}

# Optional Cloudflare Turnstile secret; step-up CAPTCHA is enforced after suspicious login activity when configured.
omw.auth.turnstile-secret=${OMW_AUTH_TURNSTILE_SECRET:}

# Expired refresh tokens are deleted after startup delay and then at the configured fixed interval.
omw.auth.refresh-token-cleanup-interval-ms=${OMW_AUTH_REFRESH_TOKEN_CLEANUP_INTERVAL_MS:86400000}
omw.auth.refresh-token-cleanup-initial-delay-ms=${OMW_AUTH_REFRESH_TOKEN_CLEANUP_INITIAL_DELAY_MS:60000}
